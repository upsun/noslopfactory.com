applications:
  app:
    type: nodejs:26

    build:
      flavor: none

    dependencies:
      nodejs:
        pnpm: "*"

    hooks:
      build: |
        set -ex
        pnpm install
        pnpm run build

    web:
      commands:
        start: sleep infinity

      locations:
        /:
          root: dist
          index: [index.html]
          scripts: false
          headers:
            Cache-Control: "no-cache, max-age=0, must-revalidate"
          rules:
            '^/_astro/.*$':
              headers:
                Cache-Control: "public, max-age=2419200, immutable"

routes:
  https://{default}/:
    type: upstream
    upstream: app:http
